name: Desktop test installers
on:
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Publish the tested Windows installer and NAS ZIP as a new prerelease"
        type: boolean
        default: false
      platforms:
        description: "Build Windows only, or Windows and both macOS architectures"
        type: choice
        default: windows
        options:
          - windows
          - all
permissions:
  contents: read
jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'all' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run test:native
      - run: npm run package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - uses: actions/upload-artifact@v4
        with:
          name: KAR-Schedule-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - name: Prepare Windows test release
        if: inputs.publish_test && runner.os == 'Windows'
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one installer.' }
          New-Item -ItemType Directory -Path release | Out-Null
          $name = "KAR-Schedule_${version}_windows-x64-setup.exe"
          Copy-Item $installers[0].FullName "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content release/SHA256SUMS-Windows.txt
          7z x $installers[0].FullName -oextracted -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed.' }
          python scripts/package-portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed.' }
      - name: Verify local and read-only NAS startup
        if: inputs.publish_test && runner.os == 'Windows'
        run: ./scripts/test-portable-windows.ps1
      - name: Publish verified Windows installer and NAS ZIP
        if: inputs.publish_test && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v${version}-test.1"
          $assets = @(Get-ChildItem release,portable-release -File | ForEach-Object FullName)
          gh release create $tag @assets --repo $env:RELEASE_REPO --target $env:RELEASE_COMMIT --prerelease --title "KAR 업무 일정 $version" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
